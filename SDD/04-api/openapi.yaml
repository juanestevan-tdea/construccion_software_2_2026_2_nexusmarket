openapi: 3.1.0
info:
  title: NexusMarket API
  version: 1.1.0
  description: |
    Contrato OpenAPI de los flujos principales de NexusMarket.

    **Alcance:** este archivo documenta autenticación, catálogo, órdenes,
    productos, transiciones de bodega, devoluciones, perfil y salud. La
    referencia completa de los 96 endpoints está en
    `SDD/04-api/contratos-por-endpoint.md`.

    **Seguridad:** JWT Bearer firmado con HMAC-SHA256. La identidad (`userId`)
    se obtiene del token; los cuerpos no aceptan identificadores de usuario.
    La autorización combina reglas de ruta y `@PreAuthorize`.

    **Servido automáticamente:** `springdoc-openapi` publica la especificación
    generada en runtime en `/v3/api-docs` (JSON) y `/v3/api-docs.yaml`, con
    Swagger UI en `/swagger-ui.html`. Son rutas públicas (`permitAll`). Este
    archivo se conserva como contrato de referencia curado.
servers:
  - url: http://localhost:8080
    description: Desarrollo local
tags:
  - name: Auth
  - name: Catalog
  - name: Orders
  - name: Products
  - name: Returns
  - name: Users
  - name: Health

security:
  - bearerAuth: []

paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Registrar comprador o vendedor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Invalidar las sesiones activas del usuario autenticado
      responses:
        '204':
          description: Sesiones invalidadas
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Cambiar la contraseña e invalidar sesiones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '204':
          description: Contraseña actualizada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/catalog:
    get:
      tags: [Catalog]
      summary: Listar productos activos
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/catalog/search:
    get:
      tags: [Catalog]
      summary: Buscar productos
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resultados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/catalog/products/{id}:
    get:
      tags: [Catalog]
      summary: Detalle de producto
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/seller/products:
    post:
      tags: [Products]
      summary: Crear producto (vendedor autenticado)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Products]
      summary: Listar productos (vendedor)
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/seller/products/{id}:
    patch:
      tags: [Products]
      summary: Actualizar producto propio
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  minimum: 0.01
                type:
                  $ref: '#/components/schemas/ProductType'
                categoryId:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Products]
      summary: Desactivar producto propio (soft delete)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Producto desactivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/buyer/orders:
    post:
      tags: [Orders]
      summary: Crear orden para el comprador autenticado
      description: No recibe cuerpo; el comprador se resuelve desde el JWT.
      responses:
        '201':
          description: Orden creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Orders]
      summary: Listar las órdenes del comprador autenticado
      responses:
        '200':
          description: Órdenes propias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/buyer/orders/{id}:
    get:
      tags: [Orders]
      summary: Consultar una orden propia
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Orden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/buyer/orders/{id}/items:
    post:
      tags: [Orders]
      summary: Añadir ítem a una orden propia
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: integer
                  format: int64
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Orden actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/buyer/orders/{id}/checkout:
    patch:
      tags: [Orders]
      summary: Pasar la orden a pago pendiente
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Orden en PENDING_PAYMENT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/warehouse/orders/{id}/dispatch:
    patch:
      tags: [Orders]
      summary: Marcar una orden como despachada
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Orden en DISPATCHED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/warehouse/orders/{id}/deliver:
    patch:
      tags: [Orders]
      summary: Marcar una orden como entregada
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Orden en DELIVERED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/warehouse/orders/{id}/finish:
    patch:
      tags: [Orders]
      summary: Marcar una orden como finalizada
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Orden en FINISHED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/buyer/returns:
    post:
      tags: [Returns]
      summary: Solicitar devolución de una orden propia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, reason]
              properties:
                orderId:
                  type: integer
                  format: int64
                reason:
                  type: string
      responses:
        '201':
          description: Devolución creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags: [Returns]
      summary: Listar devoluciones propias
      responses:
        '200':
          description: Devoluciones del comprador autenticado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReturnResponse'

  /api/v1/supervisor/returns/{id}/approve:
    patch:
      tags: [Returns]
      summary: Aprobar una devolución (SUPERVISOR)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Devolución aprobada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/users/me:
    get:
      tags: [Users]
      summary: Perfil del usuario autenticado
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  email:
                    type: string
                  fullName:
                    type: string
                  role:
                    type: string
                    enum: [ADMIN, BUYER, SELLER, SUPERVISOR, WAREHOUSE_OPERATOR]
                  status:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /actuator/health:
    get:
      tags: [Health]
      summary: Estado del servicio
      security: []
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Petición inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Rol insuficiente o recurso de otro usuario
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto de estado o duplicidad
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Regla de negocio violada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [email, fullName, password, role]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
          minLength: 3
          maxLength: 120
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
          enum: [BUYER, SELLER]
        primaryAddress:
          type: string
        taxId:
          type: string
        companyName:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        tokenType:
          type: string
          example: Bearer
        token:
          type: string
        expiresIn:
          type: integer
          format: int64
          example: 86400000
        id:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [ADMIN, BUYER, SELLER, SUPERVISOR, WAREHOUSE_OPERATOR]

    ProductType:
      type: string
      enum: [PHYSICAL, DIGITAL, SERVICE]

    ProductCreateRequest:
      type: object
      required: [sku, name, price, type, categoryId]
      properties:
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0.01
        type:
          $ref: '#/components/schemas/ProductType'
        categoryId:
          type: integer
          format: int64

    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        type:
          $ref: '#/components/schemas/ProductType'
        active:
          type: boolean
        sellerId:
          type: integer
          format: int64
        sellerCompanyName:
          type: string
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string

    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        buyerId:
          type: integer
          format: int64
        buyerEmail:
          type: string
        status:
          type: string
          enum: [CART, PENDING_PAYMENT, PAID, DISPATCHED, DELIVERED, FINISHED, CANCELLED]
        totalAmount:
          type: number
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              productId:
                type: integer
                format: int64
              quantity:
                type: integer
              unitPrice:
                type: number

    ReturnResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        reason:
          type: string
        status:
          type: string
          enum: [REQUESTED, APPROVED, REJECTED, COMPLETED]
        requestedAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        details:
          type: [array, "null"]
          items:
            type: string
