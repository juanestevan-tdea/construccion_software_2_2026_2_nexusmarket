###############################################################################
# COMPONENTES
###############################################################################
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido por POST /api/auth/login

  ###############################################################################
  # RESPUESTAS COMPARTIDAS
  ###############################################################################
  responses:
    BadRequest:
      description: Solicitud inválida (validación o parámetros)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No autenticado (token ausente/expirado/inválido)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Rol insuficiente para acceder al recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto (duplicidad, transición inválida)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Regla de negocio violada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  ###############################################################################
  # PARÁMETROS COMPARTIDOS
  ###############################################################################
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathUserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathBuyerId:
      name: buyerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathSellerId:
      name: sellerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathCategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathWarehouseId:
      name: warehouseId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathInventoryId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathOrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathOrderItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathInvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathRefundId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathShipmentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathReturnId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathAuditId:
      name: id
      in: path
      required: true
      schema:
        type: string
    PathUserRole:
      name: role
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserRole'
    PathBuyerCommercialStatus:
      name: status
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BuyerCommercialStatus'
    PathWarehouseType:
      name: type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WarehouseType'
    QueryEmail:
      name: email
      in: query
      required: true
      schema:
        type: string
        format: email
    QueryTaxId:
      name: taxId
      in: query
      required: true
      schema:
        type: string
    QueryNewRole:
      name: newRole
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/UserRole'
    QueryAddress:
      name: address
      in: query
      required: true
      schema:
        type: string
    QueryNewCommercialStatus:
      name: newStatus
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/BuyerCommercialStatus'
    QueryPriceMin:
      name: min
      in: query
      required: true
      schema:
        type: number
        format: double
        minimum: 0
    QueryPriceMax:
      name: max
      in: query
      required: true
      schema:
        type: number
        format: double
        minimum: 0
    QuerySearch:
      name: query
      in: query
      required: false
      schema:
        type: string
    QueryReserveAmount:
      name: amount
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    QueryAdjustAmount:
      name: amount
      in: query
      required: true
      schema:
        type: integer
    QueryAuditUserId:
      name: userId
      in: query
      required: false
      schema:
        type: integer
        format: int64
    QueryAuditEntityName:
      name: entityName
      in: query
      required: false
      schema:
        type: string
    QueryAuditStart:
      name: start
      in: query
      required: false
      schema:
        type: string
        format: date-time
    QueryAuditEnd:
      name: end
      in: query
      required: false
      schema:
        type: string
        format: date-time
    PathTrackingNumber:
      name: trackingNumber
      in: path
      required: true
      schema:
        type: string

  ###############################################################################
  # SCHEMAS (DTOs y modelos)
  ###############################################################################
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        path:
          type: string
          example: /api/products
        timestamp:
          type: string
          format: date-time
        details:
          type: array
          items:
            type: string
        validationErrors:
          type: object
          additionalProperties:
            type: string

    ###############################################################################
    # AUTH
    ###############################################################################
    RegisterRequestDTO:
      type: object
      required: [email, fullName, password, role]
      properties:
        email:
          type: string
          format: email
          example: comprador@nexus.com
        fullName:
          type: string
          example: Juan Pérez
        password:
          type: string
          minLength: 6
          example: Password123
        role:
          $ref: '#/components/schemas/UserRole'
        primaryAddress:
          type: string
          example: Calle 123 #45-67
        taxId:
          type: string
          example: "900.123.456-7"
        companyName:
          type: string
          example: TechStore SAS

    LoginRequestDTO:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: comprador@nexus.com
        password:
          type: string
          example: Password123

    AuthResponseDTO:
      type: object
      properties:
        tokenType:
          type: string
          example: Bearer
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...
        expiresIn:
          type: integer
          example: 86400000
        id:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    ###############################################################################
    # USERS / BUYERS / SELLERS
    ###############################################################################
    UserCreateRequestDTO:
      type: object
      required: [email, fullName, password, role]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
        password:
          type: string
          minLength: 6
        role:
          $ref: '#/components/schemas/UserRole'

    UserResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BuyerCreateRequestDTO:
      type: object
      required: [userId, primaryAddress]
      properties:
        userId:
