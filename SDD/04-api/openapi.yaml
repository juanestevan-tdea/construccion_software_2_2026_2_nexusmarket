openapi: 3.1.0
info:
  title: NexusMarket API
  version: 1.0.0
  description: |
    Backend de marketplace multi-vendedor construido con arquitectura hexagonal
    (ports & adapters), Spring Boot 3.4 y Java 17. Autenticación JWT stateless
    con RBAC (5 roles: BUYER, SELLER, WAREHOUSE_OPERATOR, ADMIN, SUPERVISOR).
    Persistencia híbrida: MySQL (JPA) para datos transaccionales y MongoDB para
    auditoría.
  contact:
    name: NexusMarket Team
    email: dev@nexusmarket.local
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Servidor de desarrollo local
  - url: https://api.nexusmarket.local
    description: Servidor de producción
tags:
  - name: auth
    description: Autenticación pública (registro y login)
  - name: users
    description: Gestión de usuarios (ADMIN)
  - name: buyers
    description: Perfiles de comprador
  - name: sellers
    description: Perfiles de vendedor
  - name: catalog
    description: Catálogo de productos, categorías y bodegas
  - name: inventory
    description: Gestión de inventario por bodega
  - name: orders
    description: Órdenes de compra y ciclo de vida
  - name: invoices
    description: Facturación
  - name: refunds
    description: Reembolsos
  - name: shipments
    description: Envíos y tracking
  - name: returns
    description: Devoluciones
  - name: audit
    description: Auditoría de operaciones (ADMIN, SUPERVISOR)
paths:
  ###############################################################################
  # AUTH (público)
  ###############################################################################
  /api/auth/register:
    post:
      tags: [auth]
      summary: Registro de usuario (BUYER o SELLER)
      operationId: authRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestDTO'
      responses:
        '201':
          description: Usuario creado y token JWT emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Login y obtención de JWT
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDTO'
      responses:
        '200':
          description: Autenticación exitosa, retorna JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  ###############################################################################
  # USERS
  ###############################################################################
  /api/users:
    post:
      tags: [users]
      summary: Crear usuario (ADMIN)
      operationId: usersCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequestDTO'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [users]
      summary: Listar todos los usuarios (ADMIN)
      operationId: usersList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/me:
    get:
      tags: [users]
      summary: Consultar perfil del usuario autenticado
      operationId: usersMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{id}:
    get:
      tags: [users]
      summary: Consultar usuario por ID (ADMIN)
      operationId: usersGetById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/email:
    get:
      tags: [users]
      summary: Consultar usuario por email (ADMIN)
      operationId: usersGetByEmail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QueryEmail'
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/role/{role}:
    get:
      tags: [users]
      summary: Listar usuarios por rol (ADMIN)
      operationId: usersGetByRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathUserRole'
      responses:
        '200':
          description: Lista de usuarios por rol
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{id}/block:
    patch:
      tags: [users]
      summary: Bloquear usuario (ADMIN)
      operationId: usersBlock
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Usuario bloqueado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{id}/activate:
    patch:
      tags: [users]
      summary: Activar usuario (ADMIN)
      operationId: usersActivate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Usuario activado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{id}/role:
    patch:
      tags: [users]
      summary: Cambiar rol de usuario (ADMIN)
      operationId: usersChangeRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/QueryNewRole'
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  ###############################################################################
  # BUYERS
  ###############################################################################
  /api/buyers:
    post:
      tags: [buyers]
      summary: Crear comprador
      operationId: buyersCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerCreateRequestDTO'
      responses:
        '201':
          description: Comprador creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [buyers]
      summary: Listar compradores
      operationId: buyersList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de compradores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BuyerResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/buyers/{id}:
    get:
      tags: [buyers]
      summary: Consultar comprador por ID
      operationId: buyersGetById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Comprador encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/buyers/status/{status}:
    get:
      tags: [buyers]
      summary: Listar compradores por estado comercial
      operationId: buyersGetByStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathBuyerCommercialStatus'
      responses:
        '200':
          description: Lista de compradores por estado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BuyerResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/buyers/{id}/addresses:
    post:
      tags: [buyers]
      summary: Agregar dirección adicional al comprador
      operationId: buyersAddAddress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/QueryAddress'
      responses:
        '200':
          description: Dirección agregada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/buyers/{id}/status:
    patch:
      tags: [buyers]
      summary: Cambiar estado comercial del comprador
      operationId: buyersChangeCommercialStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/QueryNewCommercialStatus'
      responses:
        '200':
          description: Estado comercial actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  ###############################################################################
  # SELLERS
  ###############################################################################
  /api/sellers:
    post:
      tags: [sellers]
      summary: Crear vendedor
      operationId: sellersCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerCreateRequestDTO'
      responses:
        '201':
          description: Vendedor creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [sellers]
      summary: Listar vendedores
      operationId: sellersList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de vendedores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SellerResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sellers/{id}:
    get:
      tags: [sellers]
      summary: Consultar vendedor por ID
      operationId: sellersGetById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Vendedor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sellers/taxId:
    get:
      tags: [sellers]
      summary: Consultar vendedor por taxId
      operationId: sellersGetByTaxId
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QueryTaxId'
      responses:
        '200':
          description: Vendedor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sellers/{id}/activate:
    patch:
      tags: [sellers]
      summary: Activar vendedor
      operationId: sellersActivate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Vendedor activado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sellers/{id}/deactivate:
    patch:
      tags: [sellers]
      summary: Desactivar vendedor
      operationId: sellersDeactivate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Vendedor desactivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sellers/{id}/update:
    patch:
      tags: [sellers]
      summary: Actualizar vendedor
      operationId: sellersUpdate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerUpdateRequestDTO'
      responses:
        '200':
          description: Vendedor actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  ###############################################################################
  # CATALOG - PRODUCTS
  ###############################################################################
  /api/products:
    post:
      tags: [catalog]
      summary: Crear producto
      operationId: productsCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequestDTO'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [catalog]
      summary: Listar productos
      operationId: productsList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/products/{id}:
    get:
      tags: [catalog]
      summary: Consultar producto por ID
      operationId: productsGetById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [catalog]
      summary: Actualizar producto
      operationId: productsUpdate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequestDTO'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [catalog]
      summary: Desactivar producto (soft delete)
      operationId: productsDelete
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Producto desactivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/products/category/{categoryId}:
    get:
      tags: [catalog]
      summary: Listar productos por categoría
      operationId: productsGetByCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathCategoryId'
      responses:
        '200':
          description: Lista de productos por categoría
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/products/seller/{sellerId}:
    get:
      tags: [catalog]
      summary: Listar productos por vendedor
      operationId: productsGetBySeller
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathSellerId'
      responses:
        '200':
          description: Lista de productos por vendedor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/products/price-range:
    get:
      tags: [catalog]
      summary: Listar productos por rango de precio
      operationId: productsGetByPriceRange
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QueryPriceMin'
        - $ref: '#/components/parameters/QueryPriceMax'
      responses:
        '200':
          description: Lista de productos en rango de precio
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  ###############################################################################
  # CATALOG - CATEGORIES
  ###############################################################################
  /api/categories:
    post:
      tags: [catalog]
      summary: Crear categoría
      operationId: categoriesCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequestDTO'
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [catalog]
      summary: Listar categorías
      operationId: categoriesList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

