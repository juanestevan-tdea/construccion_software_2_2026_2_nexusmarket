# ===== Servidor =====
server.port=8080
spring.application.name=nexus-market

# ===== Base de datos MySQL =====
# Credentials and connection URL are externalized. DB_PASSWORD is mandatory.
# DB_URL and DB_USERNAME keep local-development defaults and must be overridden
# in any shared or production environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexusmarket?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
# SQL logging is opt-in: it can expose query shapes and data in shared logs.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# MongoDB connection string, externalized as MONGODB_URI.
# Fallback points to local instance (consistent with docker-compose.yml).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexusmarket_audit}

# ===== JWT (JSON Web Token) =====
# HMAC-SHA256 signing key. JWT_SECRET is mandatory and must contain at least
# 32 random bytes. There is intentionally no fallback in source control: the
# application fails fast at startup when it is missing or too short.
# Rotating this value immediately invalidates every previously issued token.
jwt.secret=${JWT_SECRET:}
# Token time-to-live in milliseconds (86400000 ms = 24 hours by default).
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Logging =====
logging.level.com.nexusmarket=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=${MONGODB_LOG_LEVEL:INFO}
# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
