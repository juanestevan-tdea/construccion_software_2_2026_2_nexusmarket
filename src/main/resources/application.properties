# ===== Servidor =====
server.port=8080
spring.application.name=nexus-market

# ===== Base de datos MySQL =====
# Credentials are externalized. Provide DB_USERNAME / DB_PASSWORD in the environment
# for any deployment; the literals below are development fallbacks only.
spring.datasource.url=jdbc:mysql://localhost:3306/nexusmarket?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

