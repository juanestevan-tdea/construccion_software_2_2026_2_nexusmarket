# ===== Servidor =====
server.port=8080
spring.application.name=nexus-market

# ===== Base de datos MySQL =====
# Credentials and connection URL are externalized. Provide DB_URL / DB_USERNAME / DB_PASSWORD
# in the environment for any deployment; the literals below are development fallbacks only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexusmarket?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# MongoDB connection string, externalized as MONGODB_URI.
# Fallback points to local instance (consistent with docker-compose.yml).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexusmarket_audit}

# ===== JWT (JSON Web Token) =====
# HMAC-SHA256 signing key. 64 alphanumeric characters = 512 bits of entropy,
# comfortably above the 256-bit minimum required by HS256.
# PRODUCTION: override with the JWT_SECRET environment variable and rotate every 90 days.
# Rotating this value immediately invalidates every previously issued token.
jwt.secret=${JWT_SECRET:Q7mZx2KpR9vTnB4wYhL6sJdF3gA8cE5uM1iX0oP7rN2qW9tV4bH6kD3sZ8fG5jC1}
# Token time-to-live in milliseconds (86400000 ms = 24 hours).
jwt.expiration=86400000

# ===== Logging =====
logging.level.com.nexusmarket=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=DEBUG
# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized