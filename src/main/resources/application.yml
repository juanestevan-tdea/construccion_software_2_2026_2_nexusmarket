spring:
  application:
    name: nexus-market

  # ========================
  # CONFIGURACIÓN DE MYSQL
  # ========================
  datasource:
    url: jdbc:mysql://localhost:3306/nexusmarket_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ========================
  # CONFIGURACIÓN DE MONGODB
  # ========================
  data:
    mongodb:
      host: localhost
      port: 27017
      database: nexusmarket_mongo
      authentication-database: admin
      username: admin
      password: admin123

# ========================
# CONFIGURACIÓN DEL SERVIDOR
# ========================
server:
  port: 8080

# ========================
# NIVELES DE LOGGING (para depuración)
# ========================
logging:
  level:
    com.nexusmarket: DEBUG
    org.springframework.web: INFO
    org.springframework.boot: INFO
    org.springframework.data: INFO